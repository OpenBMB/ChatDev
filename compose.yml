services:
  # Bind mounts hide the image's /app ownership. Prepare only runtime storage
  # before starting the non-root backend, including on root-owned checkouts.
  backend-init:
    build: &backend-build
      context: .
      dockerfile: Dockerfile
      target: runtime
    user: "0:0"
    entrypoint: ["python", "/usr/local/bin/init-runtime-dirs.py"]
    volumes:
      - .:/app
    restart: "no"

  backend:
    build: *backend-build
    container_name: chatdev_backend
    depends_on:
      backend-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    ports:
      - "6400:6400"
    env_file:
      - .env
      - .env.docker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: chatdev_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
      - .env.docker
    depends_on:
      - backend
    restart: unless-stopped
